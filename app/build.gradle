plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.v2raytunbalancer'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.v2raytunbalancer"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
}